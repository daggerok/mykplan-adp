# GitLab Pages, the old address of the viewer (the main one is GitHub Pages since 2026-11-22), same setup as daggerok/journal:
# pages_access_level = private, unique domain off -> https://daggerok.gitlab.io/mykplan-adp (only project members)
image: oven/bun:1.4.2

stages: [test, deploy]

cache:
  key:
    files: [bun.lock]
  paths: [node_modules/]

test:
  stage: test
  script:
    # the raw zip tests check the archive with the real unzip, missing in oven/bun
    - command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip >/dev/null)
    - bun install --frozen-lockfile
    - bun test
    - bun run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  needs: [test]
  script:
    - bun install --frozen-lockfile
    - bun run build:pages
    - rm -rf public && cp -r dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
